[project]
name = "hireloop"
version = "0.1.0"
description = "HireLoop: an MCP server for job search, fit analysis, mock interviews and a personalised prep plan."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # FastMCP lives in mcp 1.x; mcp 2.x renamed it to MCPServer.
    "mcp>=1.2,<2",
    "groq>=0.11",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Local embeddings (no AWS needed). Without it, a hashing fallback is used.
local = ["fastembed>=0.3"]
# Voice interviews (ElevenLabs)
voice = ["elevenlabs>=1.0"]
# Amazon Bedrock
aws = ["boto3>=1.34"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
hireloop-server = "server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
